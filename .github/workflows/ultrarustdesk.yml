name: UltraRustDesk Build

# Builds every platform with the upstream flutter-build.yml and publishes the
# results as a pre-release, then renames the assets from rustdesk-* to
# ultrarustdesk-*. It runs on every push to the ultrarustdesk branch.
# GitHub offers the manual "Run workflow" button only for workflows on the
# default branch, so workflow_dispatch works once this file is on master.

on:
  push:
    branches:
      - ultrarustdesk
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to (re)create"
        type: string
        default: "ultrarustdesk-nightly"

concurrency:
  group: ultrarustdesk-${{ inputs.tag || 'ultrarustdesk-nightly' }}
  cancel-in-progress: false

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag || 'ultrarustdesk-nightly' }}
    steps:
      - name: Recreate the release at this commit
        run: |
          gh release delete "$TAG" -R "$GITHUB_REPOSITORY" --cleanup-tag -y || true
          cat > notes.md <<EOF
          UltraRustDesk build from \`${GITHUB_REF_NAME}\` at ${GITHUB_SHA}.

          - Windows: \`ultrarustdesk-*-x86_64.exe\` (portable, can install itself) or \`.msi\`. Not code-signed, so SmartScreen warns on first run.
          - Android: \`ultrarustdesk-*-universal.apk\` fits every phone; the per-ABI APKs are smaller. Signed with a CI debug key, so uninstall before installing a newer build.
          - macOS: \`.dmg\`, not signed or notarized: right-click the app and choose Open.
          - iOS: \`ultrarustdesk-*-ios-unsigned.ipa\`, sign it while sideloading (AltStore, Sideloadly).
          - Linux: \`.deb\`, \`.rpm\`, AppImage and Flatpak. These keep the internal RustDesk names (see ultrarustdesk/README.md).
          EOF
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --title "UltraRustDesk ($TAG)" --notes-file notes.md

  build:
    needs: [prepare-release]
    permissions:
      contents: write
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: ${{ inputs.tag || 'ultrarustdesk-nightly' }}

  rename-assets:
    needs: [prepare-release, build]
    if: ${{ !cancelled() && needs.prepare-release.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag || 'ultrarustdesk-nightly' }}
    steps:
      - name: Rename rustdesk-* assets to ultrarustdesk-*
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" \
            --jq '.assets[] | "\(.id) \(.name)"' |
          while read -r id name; do
            case "$name" in
              rustdesk*)
                echo "$name -> ultra$name"
                gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/assets/$id" \
                  -f name="ultra$name" > /dev/null
                ;;
            esac
          done
